<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Bar magnet field lines from N to S">
  <rect width="680" height="300" fill="#f8fafc"/>
  <!-- field lines -->
  <g fill="none" stroke="#7c3aed" stroke-width="2">
    <path d="M280,90 C200,40 120,50 90,100 C60,150 120,200 200,210 C240,215 260,200 280,180"/>
    <path d="M280,110 C220,70 150,80 130,120 C110,160 160,190 230,195 C250,197 265,185 280,170"/>
    <path d="M280,130 C240,110 200,115 185,140 C170,165 210,175 250,175 C265,175 275,165 280,155"/>
    <path d="M400,90 C480,40 560,50 590,100 C620,150 560,200 480,210 C440,215 420,200 400,180"/>
    <path d="M400,110 C460,70 530,80 550,120 C570,160 520,190 450,195 C430,197 415,185 400,170"/>
    <path d="M400,130 C440,110 480,115 495,140 C510,165 470,175 430,175 C415,175 405,165 400,155"/>
    <path d="M280,80 C250,30 340,20 400,80"/>
    <path d="M280,220 C250,270 340,280 400,220"/>
  </g>
  <!-- arrows on a few lines -->
  <polygon points="95,105 105,98 105,112" fill="#7c3aed"/>
  <polygon points="585,105 575,98 575,112" fill="#7c3aed"/>
  <polygon points="340,45 330,52 350,52" fill="#7c3aed"/>
  <!-- bar magnet -->
  <rect x="280" y="120" width="60" height="60" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="340" y="120" width="60" height="60" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
  <text x="310" y="158" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fff">N</text>
  <text x="370" y="158" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fff">S</text>
  <!-- compass -->
  <circle cx="160" cy="70" r="22" fill="#fff" stroke="#334155" stroke-width="2"/>
  <polygon points="160,52 166,70 154,70" fill="#b91c1c"/>
  <polygon points="160,88 166,70 154,70" fill="#1e293b"/>
  <text x="160" y="108" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">compass</text>
  <text x="340" y="280" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Field lines leave N and enter S · denser = stronger B</text>
</svg>
