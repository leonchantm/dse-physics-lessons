<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Bar magnet: continuous field lines leave N and enter S">
  <rect width="680" height="300" fill="#f8fafc"/>
  <!-- Continuous exterior paths only: each starts on N left face, ends on S right face. No N-only / S-only lobes. -->
  <g fill="none" stroke="#7c3aed" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <!-- UPPER set (N → above → S) -->
    <path d="M280,138 C240,100 240,70 300,50 C360,30 420,50 400,138"/>
    <path d="M280,145 C220,95 210,50 300,30 C390,10 470,50 400,145"/>
    <path d="M280,150 C190,90 170,25 300,12 C430,-1 520,55 400,150"/>
    <!-- LOWER set (N → below → S) -->
    <path d="M280,162 C240,200 240,230 300,250 C360,270 420,250 400,162"/>
    <path d="M280,155 C220,205 210,250 300,270 C390,290 470,250 400,155"/>
    <path d="M280,150 C190,210 170,275 300,288 C430,301 520,245 400,150"/>
    <!-- FULL side loops (still N left face → around → S right face) -->
    <path d="M280,142 C200,110 100,110 80,150 C60,200 160,270 340,275 C520,280 620,200 600,150 C580,110 480,110 400,142"/>
    <path d="M280,148 C210,120 130,125 115,150 C100,180 180,235 340,240 C500,245 570,180 555,150 C540,125 460,120 400,148"/>
  </g>
  <!-- Arrows: tip = first point. Top/bottom → ; leave-N ← ; enter-S ← -->
  <g fill="#7c3aed">
    <polygon points="350,42 328,34 328,50"/>
    <polygon points="350,20 328,12 328,28"/>
    <polygon points="350,258 328,250 328,266"/>
    <polygon points="350,280 328,272 328,288"/>
    <polygon points="165,118 188,110 188,126"/>
    <polygon points="510,118 533,110 533,126"/>
  </g>
  <rect x="280" y="120" width="60" height="60" fill="#b91c1c" stroke="#7f1d1d" stroke-width="2"/>
  <rect x="340" y="120" width="60" height="60" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
  <text x="310" y="158" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fff">N</text>
  <text x="370" y="158" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#fff">S</text>
  <!-- Compass on leave-N arc; red tip tangent to B (away from N, up-left ≈ −50°) -->
  <g transform="translate(148,88) rotate(-50)">
    <circle cx="0" cy="0" r="20" fill="#fff" stroke="#334155" stroke-width="2"/>
    <polygon points="0,-16 4.5,2 -4.5,2" fill="#b91c1c"/>
    <polygon points="0,16 4.5,2 -4.5,2" fill="#1e293b"/>
  </g>
  <text x="148" y="122" text-anchor="middle" font-family="Arial" font-size="12" fill="#475569">compass</text>
  <text x="340" y="295" text-anchor="middle" font-family="Arial" font-size="14" fill="#475569">Field lines leave N and enter S · denser = stronger B</text>
</svg>
