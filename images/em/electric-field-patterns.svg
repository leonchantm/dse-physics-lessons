<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="Electric field line patterns: positive point charge, negative point charge, and parallel plates">
  <rect width="720" height="340" fill="#f8fafc"/>
  <text x="360" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0a2a66">Electric field line patterns</text>

  <!-- + point -->
  <text x="120" y="52" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#5b6170">+ point charge</text>
  <defs>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7f3f98"/></marker>
  </defs>
  <g stroke="#7f3f98" stroke-width="2" fill="none" marker-end="url(#arrP)">
    <line x1="120" y1="150" x2="120" y2="78"/>
    <line x1="120" y1="150" x2="120" y2="222"/>
    <line x1="120" y1="150" x2="48" y2="150"/>
    <line x1="120" y1="150" x2="192" y2="150"/>
    <line x1="120" y1="150" x2="69" y2="99"/>
    <line x1="120" y1="150" x2="171" y2="99"/>
    <line x1="120" y1="150" x2="69" y2="201"/>
    <line x1="120" y1="150" x2="171" y2="201"/>
  </g>
  <circle cx="120" cy="150" r="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>
  <text x="120" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="800" fill="#fff">+</text>
  <text x="120" y="255" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">outward · denser near charge</text>

  <!-- - point -->
  <text x="360" y="52" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#5b6170">− point charge</text>
  <g stroke="#7f3f98" stroke-width="2" fill="none" marker-end="url(#arrP)">
    <line x1="360" y1="78" x2="360" y2="134"/>
    <line x1="360" y1="222" x2="360" y2="166"/>
    <line x1="288" y1="150" x2="344" y2="150"/>
    <line x1="432" y1="150" x2="376" y2="150"/>
    <line x1="309" y1="99" x2="348" y2="138"/>
    <line x1="411" y1="99" x2="372" y2="138"/>
    <line x1="309" y1="201" x2="348" y2="162"/>
    <line x1="411" y1="201" x2="372" y2="162"/>
  </g>
  <circle cx="360" cy="150" r="16" fill="#2563eb" stroke="#1e3a8a" stroke-width="2"/>
  <text x="360" y="155" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#fff">−</text>
  <text x="360" y="255" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">inward · + test charge pulled in</text>

  <!-- parallel plates -->
  <text x="580" y="52" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#5b6170">Parallel ± plates</text>
  <rect x="500" y="75" width="14" height="150" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5"/>
  <rect x="646" y="75" width="14" height="150" fill="#2563eb" stroke="#1e3a8a" stroke-width="1.5"/>
  <text x="507" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#dc2626">+</text>
  <text x="653" y="70" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#2563eb">−</text>
  <g stroke="#7f3f98" stroke-width="2" fill="none" marker-end="url(#arrP)">
    <line x1="520" y1="95" x2="640" y2="95"/>
    <line x1="520" y1="125" x2="640" y2="125"/>
    <line x1="520" y1="155" x2="640" y2="155"/>
    <line x1="520" y1="185" x2="640" y2="185"/>
    <line x1="520" y1="215" x2="640" y2="215"/>
  </g>
  <text x="580" y="255" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">uniform E · + → − · E ≈ 0 outside</text>

  <rect x="80" y="280" width="560" height="42" rx="10" fill="#f3e8f8" stroke="#7f3f98" stroke-width="2"/>
  <text x="360" y="306" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7f3f98">Lines: + → − · tangent = force on +q · denser = stronger |E| · never cross</text>
</svg>
