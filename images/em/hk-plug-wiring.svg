<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="Hong Kong type G plug: earth, live, neutral and fuse">
  <rect width="720" height="320" fill="#f8fafc"/>
  <!-- Plug body -->
  <rect x="40" y="60" width="220" height="200" rx="18" fill="#e2e8f0" stroke="#334155" stroke-width="3"/>
  <text x="150" y="50" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0a2a66">Type G plug (HK)</text>
  <!-- Earth pin (top, longer) -->
  <rect x="130" y="28" width="40" height="55" rx="4" fill="#16a34a" stroke="#14532d" stroke-width="2"/>
  <text x="150" y="95" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#14532d">E</text>
  <text x="150" y="112" text-anchor="middle" font-family="Arial" font-size="11" fill="#166534">green/yellow</text>
  <!-- Facing pins (looking at pin face): left = N (blue), right = L (brown + fuse), top = E -->
  <!-- Neutral pin (left) -->
  <rect x="70" y="175" width="40" height="50" rx="4" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
  <text x="90" y="165" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#1e3a8a">N</text>
  <text x="90" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#1e40af">blue</text>
  <!-- Live pin (right) -->
  <rect x="190" y="175" width="40" height="50" rx="4" fill="#b45309" stroke="#78350f" stroke-width="2"/>
  <text x="210" y="165" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#78350f">L</text>
  <text x="210" y="240" text-anchor="middle" font-family="Arial" font-size="11" fill="#92400e">brown</text>
  <!-- Fuse cartridge (in live path; shown near live / right) -->
  <rect x="155" y="125" width="70" height="28" rx="6" fill="#fef3c7" stroke="#ca8a04" stroke-width="2"/>
  <text x="190" y="144" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#92400e">13 A fuse</text>
  <!-- Wiring diagram right -->
  <text x="480" y="50" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0a2a66">To appliance (parallel)</text>
  <!-- Consumer unit box -->
  <rect x="320" y="80" width="100" height="70" rx="8" fill="#eef3fe" stroke="#1865f2" stroke-width="2"/>
  <text x="370" y="110" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#0a2a66">Consumer</text>
  <text x="370" y="128" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#0a2a66">unit</text>
  <!-- Three wires -->
  <line x1="420" y1="100" x2="520" y2="100" stroke="#b45309" stroke-width="4"/>
  <line x1="420" y1="115" x2="520" y2="115" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="420" y1="130" x2="520" y2="130" stroke="#16a34a" stroke-width="4"/>
  <text x="535" y="104" font-family="Arial" font-size="12" font-weight="700" fill="#b45309">L</text>
  <text x="535" y="119" font-family="Arial" font-size="12" font-weight="700" fill="#1d4ed8">N</text>
  <text x="535" y="134" font-family="Arial" font-size="12" font-weight="700" fill="#16a34a">E</text>
  <!-- Two parallel appliances -->
  <rect x="560" y="70" width="90" height="50" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="605" y="100" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#7f1d1d">kettle</text>
  <rect x="560" y="145" width="90" height="50" rx="6" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="605" y="175" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#14532d">lamp</text>
  <line x1="520" y1="100" x2="560" y2="95" stroke="#b45309" stroke-width="2"/>
  <line x1="520" y1="115" x2="560" y2="105" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="520" y1="100" x2="560" y2="160" stroke="#b45309" stroke-width="2"/>
  <line x1="520" y1="115" x2="560" y2="170" stroke="#1d4ed8" stroke-width="2"/>
  <line x1="520" y1="130" x2="560" y2="120" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="520" y1="130" x2="560" y2="185" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="480" y="250" text-anchor="middle" font-family="Arial" font-size="13" fill="#5b6170">Sockets / lamps share L–N in parallel → each gets ~220 V</text>
  <text x="480" y="275" text-anchor="middle" font-family="Arial" font-size="13" fill="#5b6170">Earth keeps metal case at 0 V if live touches it</text>
  <text x="150" y="290" text-anchor="middle" font-family="Arial" font-size="12" fill="#5b6170">Facing pins: left = Neutral, right = Live (+fuse), top = Earth (longer)</text>
</svg>
