<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Practical cell modelled as emf epsilon in series with internal resistance r, connected to external load R, showing terminal voltage V">
  <rect width="640" height="260" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0a2a66">Practical cell: ε and internal r</text>
  <!-- dashed box for cell -->
  <rect x="80" y="70" width="200" height="120" rx="10" fill="#eef3fe" stroke="#1865f2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="92" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#1865f2">inside the cell</text>
  <!-- emf: long = +, short thick = − -->
  <line x1="120" y1="120" x2="120" y2="160" stroke="#0a2a66" stroke-width="4"/>
  <line x1="108" y1="128" x2="108" y2="152" stroke="#0a2a66" stroke-width="7"/>
  <text x="100" y="112" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#0a2a66">ε</text>
  <!-- + → r → external → R → return → −  (no bare wire parallel to R) -->
  <path d="M120 140 H140" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M140 140 L152 125 L168 155 L184 125 L200 155 L216 125 L232 140" fill="none" stroke="#e3780c" stroke-width="3" stroke-linejoin="round"/>
  <text x="186" y="112" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#e3780c">r</text>
  <path d="M232 140 H400" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M400 140 L412 125 L428 155 L444 125 L460 140" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round"/>
  <text x="430" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c">R (load)</text>
  <!-- return from R end to − plate only -->
  <path d="M460 140 V200 H108 V152" fill="none" stroke="#334155" stroke-width="3"/>
  <!-- terminal V bracket (measurement, above circuit — not a current path) -->
  <path d="M280 70 V55 H460 V70" fill="none" stroke="#186d32" stroke-width="2"/>
  <text x="370" y="48" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#186d32">terminal V = ε − Ir = IR</text>
  <rect x="120" y="210" width="400" height="36" rx="8" fill="#f3e8f8" stroke="#7f3f98" stroke-width="2"/>
  <text x="320" y="233" text-anchor="middle" font-family="Cambria Math,Times New Roman,serif" font-size="15" font-weight="700" fill="#0a2a66">ε = I(R + r)  lost volts = Ir</text>
</svg>
