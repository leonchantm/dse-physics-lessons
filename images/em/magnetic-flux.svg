<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Magnetic flux through a loop: B, A and angle theta">
  <rect width="640" height="300" fill="#f8fafc"/>
  <!-- loop -->
  <ellipse cx="220" cy="160" rx="110" ry="55" fill="none" stroke="#1865f2" stroke-width="4"/>
  <text x="220" y="168" font-size="14" font-weight="700" text-anchor="middle" fill="#1865f2">area A</text>
  <!-- normal -->
  <line x1="220" y1="160" x2="220" y2="55" stroke="#7f3f98" stroke-width="2.5" stroke-dasharray="6 4"/>
  <polygon points="220,48 214,62 226,62" fill="#7f3f98"/>
  <text x="236" y="70" font-size="13" font-weight="700" fill="#7f3f98">normal</text>
  <!-- B field arrows tilted -->
  <g stroke="#0a2a66" stroke-width="2.5" fill="#0a2a66">
    <line x1="140" y1="40" x2="185" y2="115"/><polygon points="185,115 172,108 180,100"/>
    <line x1="200" y1="35" x2="245" y2="110"/><polygon points="245,110 232,103 240,95"/>
    <line x1="260" y1="40" x2="305" y2="115"/><polygon points="305,115 292,108 300,100"/>
  </g>
  <text x="160" y="38" font-size="14" font-weight="700" fill="#0a2a66">B</text>
  <!-- angle arc -->
  <path d="M220,90 A35,35 0 0 1 248,105" fill="none" stroke="#e3780c" stroke-width="2.5"/>
  <text x="252" y="98" font-size="14" font-weight="700" fill="#e3780c">θ</text>
  <!-- formula panel -->
  <rect x="380" y="60" width="230" height="180" rx="12" fill="#eef3fe" stroke="#1865f2" stroke-width="2"/>
  <text x="495" y="95" font-size="16" font-weight="800" text-anchor="middle" fill="#0a2a66">Φ = B A cosθ</text>
  <text x="495" y="125" font-size="13" text-anchor="middle" fill="#334155">θ = angle between B</text>
  <text x="495" y="145" font-size="13" text-anchor="middle" fill="#334155">and the normal to A</text>
  <text x="495" y="175" font-size="13" text-anchor="middle" fill="#334155">θ = 0 → Φ = BA (max)</text>
  <text x="495" y="195" font-size="13" text-anchor="middle" fill="#334155">θ = 90° → Φ = 0</text>
  <text x="495" y="220" font-size="13" font-weight="700" text-anchor="middle" fill="#1865f2">unit: weber (Wb)</text>
</svg>
