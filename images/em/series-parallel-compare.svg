<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-label="Series: one loop with R1 then R2. Parallel: two branches sharing the same voltage across each resistor.">
  <rect width="680" height="320" fill="#f8fafc"/>
  <text x="340" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0a2a66">Series vs parallel — paths for charge</text>

  <!-- ========== SERIES ========== -->
  <rect x="24" y="44" width="300" height="250" rx="12" fill="#fff" stroke="#e3e5ea"/>
  <text x="174" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#1865f2">SERIES 串聯</text>
  <text x="174" y="88" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">one path · same I · V adds</text>

  <path d="M78 140 H105" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M175 140 H195" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M265 140 H280 V220 H78 V140" fill="none" stroke="#334155" stroke-width="3"/>

  <line x1="78" y1="118" x2="78" y2="162" stroke="#0a2a66" stroke-width="4"/>
  <line x1="66" y1="126" x2="66" y2="154" stroke="#0a2a66" stroke-width="7"/>
  <text x="60" y="108" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#1865f2">ε</text>

  <path d="M105 140 L117 125 L133 155 L149 125 L165 155 L175 140" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round"/>
  <text x="140" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#b91c1c">R₁</text>

  <path d="M195 140 L207 125 L223 155 L239 125 L255 155 L265 140" fill="none" stroke="#7f3f98" stroke-width="3" stroke-linejoin="round"/>
  <text x="230" y="118" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7f3f98">R₂</text>

  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#186d32"/></marker>
  </defs>
  <line x1="88" y1="128" x2="102" y2="128" stroke="#186d32" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="95" y="120" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#186d32">I</text>
  <text x="174" y="255" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">charge has only one path</text>
  <text x="174" y="278" text-anchor="middle" font-family="Cambria Math,Times New Roman,serif" font-size="14" font-weight="700" fill="#0a2a66">R = R₁ + R₂</text>

  <!-- ========== PARALLEL ========== -->
  <!-- Topology: + → left rail ONLY; branches through R1/R2 only; right rail → outside return → −. No bare wire joins left↔right rails. -->
  <rect x="356" y="44" width="300" height="250" rx="12" fill="#fff" stroke="#e3e5ea"/>
  <text x="506" y="68" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#1865f2">PARALLEL 並聯</text>
  <text x="506" y="88" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">two paths · same V · I adds</text>

  <!-- Cell: long thin = + (x=400), short thick = − (x=388) -->
  <line x1="400" y1="128" x2="400" y2="192" stroke="#0a2a66" stroke-width="4"/>
  <line x1="388" y1="138" x2="388" y2="182" stroke="#0a2a66" stroke-width="7"/>
  <text x="382" y="120" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#1865f2">ε</text>

  <!-- + → left rail mid (stops at left rail; never continues to right) -->
  <path d="M400 160 H430" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- Left junction rail -->
  <path d="M430 120 V200" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="430" cy="120" r="4" fill="#334155"/>
  <circle cx="430" cy="160" r="4" fill="#334155"/>
  <circle cx="430" cy="200" r="4" fill="#334155"/>

  <!-- Top branch through R₁ only -->
  <path d="M430 120 H458" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M458 120 L470 105 L486 135 L502 105 L518 135 L534 105 L546 120" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M546 120 H580" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="502" y="98" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#b91c1c">R₁</text>
  <text x="562" y="112" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#186d32">I₁</text>

  <!-- Bottom branch through R₂ only -->
  <path d="M430 200 H458" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M458 200 L470 185 L486 215 L502 185 L518 215 L534 185 L546 200" fill="none" stroke="#7f3f98" stroke-width="3" stroke-linejoin="round"/>
  <path d="M546 200 H580" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="502" y="238" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#7f3f98">R₂</text>
  <text x="562" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#186d32">I₂</text>

  <!-- Right junction rail — NO horizontal mid link to left rail -->
  <path d="M580 120 V200" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="580" cy="120" r="4" fill="#334155"/>
  <circle cx="580" cy="200" r="4" fill="#334155"/>

  <!-- − return from RIGHT rail BOTTOM, outside below ladder, to − plate only -->
  <path d="M580 200 V230 H388 V182" fill="none" stroke="#334155" stroke-width="3"/>

  <line x1="408" y1="148" x2="422" y2="148" stroke="#186d32" stroke-width="2.5" marker-end="url(#arrG)"/>
  <text x="414" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#186d32">I</text>
  <text x="506" y="262" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">each branch is its own path</text>
  <text x="506" y="282" text-anchor="middle" font-family="Cambria Math,Times New Roman,serif" font-size="14" font-weight="700" fill="#0a2a66">1/R = 1/R₁ + 1/R₂</text>
</svg>
