<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" role="img" aria-label="Immersion heater in a lagged calorimeter with thermometer and joulemeter for measuring specific heat capacity.">
  <rect width="540" height="300" fill="#fff"/>
  <text x="270" y="20" text-anchor="middle" font-size="15" font-weight="700" fill="#0a2a66">Measuring specific heat capacity</text>

  <!-- Lagging -->
  <rect x="70" y="88" width="22" height="148" fill="#fde68a" stroke="#d97706"/>
  <rect x="288" y="88" width="22" height="148" fill="#fde68a" stroke="#d97706"/>
  <rect x="70" y="236" width="240" height="16" fill="#fde68a" stroke="#d97706"/>
  <text x="34" y="170" text-anchor="middle" font-size="12" fill="#92400e" transform="rotate(-90 34 170)">lagging</text>

  <!-- Calorimeter + lid -->
  <rect x="92" y="100" width="196" height="136" rx="4" fill="#dbeafe" stroke="#1865f2" stroke-width="2"/>
  <rect x="86" y="88" width="208" height="14" rx="2" fill="#94a3b8"/>
  <text x="190" y="99" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">lid</text>

  <!-- Sample — bottom, clear -->
  <text x="190" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#0a2a66">liquid / solid</text>
  <text x="190" y="224" text-anchor="middle" font-size="10" fill="#5b6170">(sample)</text>

  <!-- Heater LEFT -->
  <rect x="112" y="118" width="26" height="70" rx="3" fill="#ef4444"/>
  <line x1="125" y1="88" x2="125" y2="118" stroke="#0a2a66" stroke-width="2.5"/>
  <text x="125" y="78" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">heater</text>

  <!-- Thermometer RIGHT inside vessel -->
  <rect x="248" y="94" width="10" height="95" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="250" y="110" width="6" height="65" fill="#fca5a5"/>
  <circle cx="253" cy="196" r="9" fill="#ef4444"/>

  <!-- θ label in gap BETWEEN lagging and joulemeter (no wires here) -->
  <text x="330" y="150" font-size="16" font-weight="700" fill="#0a2a66">θ</text>
  <text x="330" y="168" font-size="11" fill="#5b6170">thermometer</text>
  <line x1="260" y1="140" x2="324" y2="150" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Joulemeter -->
  <rect x="390" y="130" width="130" height="56" rx="8" fill="#eef3fe" stroke="#1865f2" stroke-width="2"/>
  <text x="455" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#0a2a66">joulemeter</text>
  <text x="455" y="172" text-anchor="middle" font-size="11" fill="#5b6170">measures E</text>

  <!-- Leads: short stub from joulemeter UP, then LEFT along top only (y=40/52), down into heater.
       Vertical segments stay at x≥370 so they never cross θ labels. -->
  <path d="M390 145 L370 145 L370 40 L125 40 L125 88"
        fill="none" stroke="#334155" stroke-width="2.2" stroke-dasharray="6 3"/>
  <path d="M390 162 L378 162 L378 52 L138 52 L138 88"
        fill="none" stroke="#334155" stroke-width="2.2" stroke-dasharray="6 3"/>
  <circle cx="125" cy="40" r="3" fill="#334155"/>
  <circle cx="138" cy="52" r="3" fill="#334155"/>
  <text x="250" y="34" text-anchor="middle" font-size="10" fill="#64748b">leads to heater</text>

  <text x="270" y="272" text-anchor="middle" font-size="13" fill="#0a2a66">E = mcΔT  (correct for energy losses where needed)</text>
  <text x="270" y="290" text-anchor="middle" font-size="11" fill="#5b6170">Insulate; stir; measure mass, E and temperature rise</text>
</svg>
