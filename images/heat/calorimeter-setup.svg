<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img" aria-label="Immersion heater in a lagged calorimeter with thermometer and joulemeter.">
  <rect width="460" height="260" fill="#fff"/>
  <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Measuring specific heat capacity</text>
  <!-- calorimeter -->
  <rect x="140" y="70" width="160" height="130" rx="6" fill="#dbeafe" stroke="#1865f2" stroke-width="2"/>
  <rect x="130" y="65" width="180" height="12" fill="#94a3b8"/>
  <text x="220" y="145" text-anchor="middle" font-size="12" fill="#0a2a66">liquid / solid</text>
  <!-- lagging -->
  <rect x="115" y="60" width="15" height="145" fill="#fde68a"/><rect x="300" y="60" width="15" height="145" fill="#fde68a"/>
  <text x="70" y="140" font-size="11" fill="#5b6170">lagging</text>
  <!-- heater -->
  <rect x="175" y="90" width="18" height="70" rx="3" fill="#ef4444"/>
  <line x1="184" y1="70" x2="184" y2="90" stroke="#0a2a66" stroke-width="2"/>
  <text x="160" y="85" font-size="10" fill="#b91c1c">heater</text>
  <!-- thermometer -->
  <rect x="245" y="55" width="8" height="90" rx="3" fill="#e2e8f0" stroke="#5b6170"/>
  <circle cx="249" cy="150" r="8" fill="#ef4444"/>
  <text x="270" y="100" font-size="10" fill="#5b6170">θ</text>
  <!-- joulemeter -->
  <rect x="350" y="90" width="90" height="50" rx="6" fill="#eef3fe" stroke="#1865f2"/>
  <text x="395" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#0a2a66">joulemeter</text>
  <line x1="350" y1="115" x2="193" y2="100" stroke="#5b6170" stroke-dasharray="3 2"/>
  <text x="230" y="235" text-anchor="middle" font-size="12" fill="#5b6170">E = mcΔT  (correct for energy losses where needed)</text>
  <text x="230" y="252" text-anchor="middle" font-size="11" fill="#5b6170">Insulate; stir; measure mass, E and temperature rise</text>
</svg>
