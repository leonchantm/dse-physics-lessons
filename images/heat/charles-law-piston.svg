<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img" aria-label="Charles law: volume increases with absolute temperature at constant pressure.">
  <rect width="440" height="200" fill="#fff"/>
  <text x="220" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Charles’ law (P constant): V ∝ T (kelvin)</text>
  <rect x="50" y="60" width="70" height="100" fill="none" stroke="#0a2a66" stroke-width="2"/>
  <rect x="52" y="110" width="66" height="48" fill="#bfdbfe"/>
  <rect x="50" y="105" width="70" height="8" fill="#94a3b8"/>
  <text x="85" y="55" text-anchor="middle" font-size="11" fill="#1865f2">cold</text>
  <text x="160" y="120" font-size="18">→</text>
  <rect x="200" y="40" width="70" height="120" fill="none" stroke="#0a2a66" stroke-width="2"/>
  <rect x="202" y="70" width="66" height="88" fill="#fecaca"/>
  <rect x="200" y="65" width="70" height="8" fill="#94a3b8"/>
  <text x="235" y="35" text-anchor="middle" font-size="11" fill="#b91c1c">hot</text>
  <text x="220" y="185" text-anchor="middle" font-size="12" fill="#5b6170">Faster molecules push piston out until P matches external pressure</text>
</svg>
