<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" role="img" aria-label="After fast molecules leave, average kinetic energy of remaining liquid falls so temperature falls.">
  <rect width="440" height="180" fill="#fff"/>
  <text x="220" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Cooling by evaporation</text>
  <text x="110" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">Before</text>
  <text x="110" y="95" text-anchor="middle" font-size="11" fill="#5b6170">mix of slow &amp; fast</text>
  <text x="110" y="115" text-anchor="middle" font-size="11" fill="#5b6170">molecules</text>
  <text x="220" y="95" font-size="20" fill="#5b6170">→</text>
  <text x="330" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#1865f2">After</text>
  <text x="330" y="88" text-anchor="middle" font-size="11" fill="#5b6170">fast molecules leave;</text>
  <text x="330" y="106" text-anchor="middle" font-size="11" fill="#5b6170">slower ones remain</text>
  <text x="330" y="124" text-anchor="middle" font-size="11" fill="#5b6170">→ lower average KE</text>
  <text x="330" y="144" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">→ lower T</text>
  <text x="220" y="168" text-anchor="middle" font-size="12" fill="#5b6170">Sweating cools the body because evaporating sweat removes energy</text>
</svg>
