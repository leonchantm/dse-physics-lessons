<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Factors that increase evaporation rate: temperature, surface area, airflow, and dryness of air.">
  <rect width="480" height="200" fill="#fff"/>
  <text x="240" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Faster evaporation when…</text>
  <rect x="20" y="45" width="100" height="110" rx="8" fill="#eef3fe" stroke="#1865f2"/>
  <text x="70" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">higher T</text>
  <text x="70" y="110" text-anchor="middle" font-size="10" fill="#5b6170">more fast</text>
  <text x="70" y="125" text-anchor="middle" font-size="10" fill="#5b6170">molecules</text>
  <rect x="135" y="45" width="100" height="110" rx="8" fill="#eef3fe" stroke="#1865f2"/>
  <text x="185" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">larger area</text>
  <text x="185" y="115" text-anchor="middle" font-size="10" fill="#5b6170">more surface</text>
  <rect x="250" y="45" width="100" height="110" rx="8" fill="#eef3fe" stroke="#1865f2"/>
  <text x="300" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">airflow</text>
  <text x="300" y="115" text-anchor="middle" font-size="10" fill="#5b6170">removes vapour</text>
  <rect x="365" y="45" width="100" height="110" rx="8" fill="#eef3fe" stroke="#1865f2"/>
  <text x="415" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">drier air</text>
  <text x="415" y="115" text-anchor="middle" font-size="10" fill="#5b6170">less return</text>
  <text x="240" y="185" text-anchor="middle" font-size="12" fill="#5b6170">Wet-bulb idea: evaporation from a wet surface cools it below dry-bulb T</text>
</svg>
