<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img" aria-label="Fast molecules leave the liquid surface during evaporation.">
  <rect width="440" height="200" fill="#fff"/>
  <text x="220" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Evaporation at the surface</text>
  <rect x="40" y="100" width="360" height="70" rx="6" fill="#93c5fd" stroke="#1865f2"/>
  <text x="220" y="140" text-anchor="middle" font-size="12" fill="#0a2a66">liquid</text>
  <circle cx="100" cy="90" r="5" fill="#e3780c"/><circle cx="160" cy="75" r="5" fill="#e3780c"/>
  <circle cx="220" cy="60" r="5" fill="#e3780c"/><circle cx="280" cy="80" r="5" fill="#e3780c"/>
  <circle cx="340" cy="55" r="5" fill="#e3780c"/>
  <path d="M100 95 L100 70" stroke="#e3780c" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6 Z" fill="#e3780c"/></marker></defs>
  <text x="220" y="45" text-anchor="middle" font-size="12" fill="#e3780c">faster molecules escape</text>
  <text x="220" y="190" text-anchor="middle" font-size="12" fill="#5b6170">Happens below boiling point; only at the surface</text>
</svg>
