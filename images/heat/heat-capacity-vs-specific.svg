<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" role="img" aria-label="Heat capacity C is for a whole object; specific heat capacity c is per kilogram.">
  <rect width="440" height="160" fill="#fff"/>
  <text x="220" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">C versus c</text>
  <rect x="30" y="50" width="160" height="70" rx="8" fill="#eef3fe" stroke="#1865f2"/>
  <text x="110" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">C = Q / ΔT</text>
  <text x="110" y="100" text-anchor="middle" font-size="11" fill="#5b6170">whole object (J °C⁻¹)</text>
  <rect x="250" y="50" width="160" height="70" rx="8" fill="#e8f5e9" stroke="#186d32"/>
  <text x="330" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#186d32">c = Q / (m ΔT)</text>
  <text x="330" y="100" text-anchor="middle" font-size="11" fill="#5b6170">per kg (J kg⁻¹ °C⁻¹)</text>
  <text x="220" y="145" text-anchor="middle" font-size="12" fill="#5b6170">C = m c</text>
</svg>
