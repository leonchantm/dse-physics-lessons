<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" role="img" aria-label="Ideal gas assumptions versus real gas behaviour.">
  <rect width="440" height="180" fill="#fff"/>
  <text x="220" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Ideal vs real gases</text>
  <rect x="20" y="45" width="190" height="100" rx="8" fill="#e8f5e9" stroke="#186d32"/>
  <text x="115" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#186d32">Ideal</text>
  <text x="115" y="95" text-anchor="middle" font-size="11" fill="#5b6170">point particles</text>
  <text x="115" y="112" text-anchor="middle" font-size="11" fill="#5b6170">no forces (except hits)</text>
  <text x="115" y="129" text-anchor="middle" font-size="11" fill="#5b6170">elastic collisions</text>
  <rect x="230" y="45" width="190" height="100" rx="8" fill="#fff7ed" stroke="#e3780c"/>
  <text x="325" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#e3780c">Real</text>
  <text x="325" y="95" text-anchor="middle" font-size="11" fill="#5b6170">finite size matters</text>
  <text x="325" y="112" text-anchor="middle" font-size="11" fill="#5b6170">attractive forces</text>
  <text x="325" y="129" text-anchor="middle" font-size="11" fill="#5b6170">at high P / low T</text>
</svg>
