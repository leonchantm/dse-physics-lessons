<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Hot and cold water mix to an intermediate equilibrium temperature.">
  <rect width="480" height="200" fill="#fff"/>
  <text x="240" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Mixing → thermal equilibrium</text>
  <rect x="30" y="50" width="100" height="80" rx="8" fill="#fecaca" stroke="#b91c1c"/>
  <text x="80" y="85" text-anchor="middle" font-size="12" font-weight="700">Hot</text>
  <text x="80" y="105" text-anchor="middle" font-size="11">T₁, m₁, c</text>
  <text x="160" y="90" font-size="20" fill="#5b6170">+</text>
  <rect x="185" y="50" width="100" height="80" rx="8" fill="#bfdbfe" stroke="#1865f2"/>
  <text x="235" y="85" text-anchor="middle" font-size="12" font-weight="700">Cold</text>
  <text x="235" y="105" text-anchor="middle" font-size="11">T₂, m₂, c</text>
  <text x="310" y="90" font-size="20" fill="#5b6170">→</text>
  <rect x="340" y="50" width="110" height="80" rx="8" fill="#fde68a" stroke="#e3780c"/>
  <text x="395" y="85" text-anchor="middle" font-size="12" font-weight="700">Mixture</text>
  <text x="395" y="105" text-anchor="middle" font-size="11">T_f</text>
  <text x="240" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">Heat lost by hot = heat gained by cold</text>
  <text x="240" y="180" text-anchor="middle" font-size="12" fill="#5b6170">(ideal: no loss to surroundings)</text>
</svg>
