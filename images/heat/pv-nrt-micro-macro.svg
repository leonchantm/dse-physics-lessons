<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" role="img" aria-label="Link between microscopic kinetic theory and macroscopic ideal gas law.">
  <rect width="460" height="200" fill="#fff"/>
  <text x="230" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Micro ↔ macro link</text>
  <rect x="20" y="50" width="180" height="70" rx="8" fill="#f3e8f8" stroke="#7f3f98"/>
  <text x="110" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#7f3f98">PV = ⅓ N m c̄²</text>
  <text x="110" y="105" text-anchor="middle" font-size="11" fill="#5b6170">microscopic</text>
  <text x="230" y="90" font-size="18">↔</text>
  <rect x="260" y="50" width="180" height="70" rx="8" fill="#eef3fe" stroke="#1865f2"/>
  <text x="350" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">PV = nRT</text>
  <text x="350" y="105" text-anchor="middle" font-size="11" fill="#5b6170">macroscopic</text>
  <text x="230" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">⇒ average molecular KE ∝ T</text>
  <text x="230" y="175" text-anchor="middle" font-size="12" fill="#5b6170">Absolute temperature measures random molecular KE</text>
</svg>
