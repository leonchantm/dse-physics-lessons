<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-label="Particle arrangements in solid, liquid and gas.">
  <rect width="480" height="200" fill="#fff"/>
  <text x="240" y="20" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">States of matter (particle picture)</text>
  <!-- solid -->
  <rect x="20" y="40" width="140" height="120" rx="8" fill="#f8fafc" stroke="#e3e5ea"/>
  <text x="90" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">Solid</text>
  <circle cx="55" cy="90" r="8" fill="#1865f2"/><circle cx="90" cy="90" r="8" fill="#1865f2"/><circle cx="125" cy="90" r="8" fill="#1865f2"/>
  <circle cx="55" cy="125" r="8" fill="#1865f2"/><circle cx="90" cy="125" r="8" fill="#1865f2"/><circle cx="125" cy="125" r="8" fill="#1865f2"/>
  <text x="90" y="175" text-anchor="middle" font-size="10" fill="#5b6170">fixed positions</text>
  <!-- liquid -->
  <rect x="170" y="40" width="140" height="120" rx="8" fill="#f8fafc" stroke="#e3e5ea"/>
  <text x="240" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">Liquid</text>
  <circle cx="200" cy="95" r="8" fill="#22c55e"/><circle cx="235" cy="85" r="8" fill="#22c55e"/><circle cx="270" cy="100" r="8" fill="#22c55e"/>
  <circle cx="215" cy="130" r="8" fill="#22c55e"/><circle cx="255" cy="135" r="8" fill="#22c55e"/>
  <text x="240" y="175" text-anchor="middle" font-size="10" fill="#5b6170">close, can slide</text>
  <!-- gas -->
  <rect x="320" y="40" width="140" height="120" rx="8" fill="#f8fafc" stroke="#e3e5ea"/>
  <text x="390" y="58" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">Gas</text>
  <circle cx="350" cy="80" r="6" fill="#e3780c"/><circle cx="400" cy="100" r="6" fill="#e3780c"/>
  <circle cx="370" cy="130" r="6" fill="#e3780c"/><circle cx="430" cy="75" r="6" fill="#e3780c"/>
  <circle cx="420" cy="140" r="6" fill="#e3780c"/>
  <text x="390" y="175" text-anchor="middle" font-size="10" fill="#5b6170">far apart, free</text>
</svg>
