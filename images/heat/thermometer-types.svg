<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img" aria-label="Three thermometer types: liquid-in-glass, resistance, and thermocouple.">
  <rect width="480" height="220" fill="#fff"/>
  <text x="240" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Thermometers use different thermometric properties</text>
  <!-- liquid-in-glass -->
  <rect x="30" y="45" width="130" height="150" rx="8" fill="#f8fafc" stroke="#e3e5ea"/>
  <text x="95" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">Liquid-in-glass</text>
  <rect x="85" y="80" width="12" height="90" rx="6" fill="#e2e8f0" stroke="#5b6170"/>
  <rect x="85" y="130" width="12" height="40" rx="6" fill="#ef4444"/>
  <circle cx="91" cy="175" r="12" fill="#ef4444"/>
  <text x="95" y="205" text-anchor="middle" font-size="11" fill="#5b6170">column length</text>
  <!-- resistance -->
  <rect x="175" y="45" width="130" height="150" rx="8" fill="#f8fafc" stroke="#e3e5ea"/>
  <text x="240" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">Resistance</text>
  <path d="M200 110 h20 l8-20 8 40 8-40 8 20 h20" fill="none" stroke="#1865f2" stroke-width="3"/>
  <rect x="195" y="145" width="90" height="28" rx="4" fill="#eef3fe" stroke="#1865f2"/>
  <text x="240" y="163" text-anchor="middle" font-size="11" fill="#0a2a66">R rises with T</text>
  <text x="240" y="205" text-anchor="middle" font-size="11" fill="#5b6170">electrical resistance</text>
  <!-- thermocouple -->
  <rect x="320" y="45" width="130" height="150" rx="8" fill="#f8fafc" stroke="#e3e5ea"/>
  <text x="385" y="65" text-anchor="middle" font-size="12" font-weight="700" fill="#0a2a66">Thermocouple</text>
  <path d="M345 100 L385 150 L425 100" fill="none" stroke="#e3780c" stroke-width="3"/>
  <circle cx="385" cy="150" r="6" fill="#e3780c"/>
  <text x="360" y="95" font-size="10" fill="#5b6170">metal A</text>
  <text x="400" y="95" font-size="10" fill="#5b6170">metal B</text>
  <text x="385" y="185" text-anchor="middle" font-size="11" fill="#0a2a66">e.m.f.</text>
  <text x="385" y="205" text-anchor="middle" font-size="11" fill="#5b6170">junction e.m.f.</text>
</svg>
