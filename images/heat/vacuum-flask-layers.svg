<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img" aria-label="Vacuum flask cross-section showing silvered walls, vacuum gap, and insulating stopper.">
  <rect width="420" height="280" fill="#fff"/>
  <text x="210" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2a66">Vacuum flask (thermos)</text>
  <!-- outer -->
  <rect x="120" y="45" width="180" height="200" rx="20" fill="none" stroke="#5b6170" stroke-width="3"/>
  <!-- inner -->
  <rect x="145" y="70" width="130" height="150" rx="14" fill="#fee2e2" stroke="#0a2a66" stroke-width="2"/>
  <text x="210" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">hot drink</text>
  <!-- vacuum label -->
  <text x="50" y="120" font-size="11" fill="#1865f2">vacuum</text>
  <text x="50" y="135" font-size="11" fill="#1865f2">(no air)</text>
  <line x1="100" y1="125" x2="140" y2="125" stroke="#1865f2" stroke-dasharray="3 2"/>
  <text x="50" y="175" font-size="11" fill="#5b6170">silvered</text>
  <text x="50" y="190" font-size="11" fill="#5b6170">walls</text>
  <!-- stopper -->
  <rect x="175" y="40" width="70" height="35" rx="4" fill="#fde68a" stroke="#e3780c"/>
  <text x="210" y="62" text-anchor="middle" font-size="11" font-weight="700">stopper</text>
  <text x="210" y="265" text-anchor="middle" font-size="11" fill="#5b6170">Vacuum ↓ conduction &amp; convection; silver ↓ radiation; stopper ↓ all three</text>
</svg>
