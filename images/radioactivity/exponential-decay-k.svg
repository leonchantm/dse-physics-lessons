<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="Exponential decay N equals N0 e to the minus kt; half-life equals ln2 over k">
  <rect width="760" height="340" fill="#f8fafc"/>
  <text x="380" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0a2a66">Exponential law · decay constant k</text>

  <!-- axes + curve -->
  <line x1="60" y1="270" x2="420" y2="270" stroke="#111" stroke-width="2"/>
  <line x1="60" y1="270" x2="60" y2="50" stroke="#111" stroke-width="2"/>
  <text x="240" y="308" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">t</text>
  <text transform="translate(18 160) rotate(-90)" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">N or A</text>
  <polyline fill="none" stroke="#7f3f98" stroke-width="3.5" stroke-linejoin="round"
    points="60,70 100,95 140,125 180,150 220,172 260,190 300,205 340,218 380,228 410,235"/>
  <circle cx="60" cy="70" r="5" fill="#dc2626"/>
  <text x="72" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">N₀</text>
  <line x1="60" y1="145" x2="175" y2="145" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <line x1="175" y1="145" x2="175" y2="270" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="175" cy="145" r="5" fill="#dc2626"/>
  <text x="175" y="290" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#92400e">t½</text>
  <text x="48" y="149" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#5b6170">½N₀</text>

  <!-- formulas panel -->
  <rect x="450" y="48" width="280" height="250" rx="12" fill="#f3e8f8" stroke="#7f3f98"/>
  <text x="590" y="78" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#5b2178">Must-use formulas</text>
  <text x="470" y="112" font-family="Cambria Math,Times New Roman,serif" font-size="16" font-weight="700" fill="#0a2a66">A = k N</text>
  <text x="470" y="142" font-family="Cambria Math,Times New Roman,serif" font-size="16" font-weight="700" fill="#0a2a66">N = N₀ e⁻ᵏᵗ</text>
  <text x="470" y="172" font-family="Cambria Math,Times New Roman,serif" font-size="16" font-weight="700" fill="#0a2a66">A = A₀ e⁻ᵏᵗ</text>
  <text x="470" y="210" font-family="Cambria Math,Times New Roman,serif" font-size="16" font-weight="700" fill="#7f3f98">t½ = ln2 / k</text>
  <text x="470" y="236" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#5b2178">≈ 0.693 / k</text>
  <text x="470" y="268" font-family="Cambria Math,Times New Roman,serif" font-size="15" font-weight="700" fill="#7f3f98">k = ln2 / t½</text>
</svg>
