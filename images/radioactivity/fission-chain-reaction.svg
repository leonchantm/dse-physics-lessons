<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="U-235 fission releases neutrons that can start a chain reaction">
  <rect width="760" height="340" fill="#f8fafc"/>
  <text x="380" y="26" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0a2a66">Fission → neutrons → chain reaction</text>

  <!-- neutron in -->
  <circle cx="50" cy="120" r="10" fill="#2563eb"/>
  <text x="50" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1e3a8a">n</text>
  <line x1="62" y1="120" x2="110" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>

  <!-- U-235 -->
  <circle cx="160" cy="120" r="36" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="160" y="116" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="#7f1d1d">U-235</text>
  <text x="160" y="134" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#7f1d1d">+ n</text>

  <line x1="200" y1="120" x2="250" y2="120" stroke="#64748b" stroke-width="2"/>
  <text x="225" y="108" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">fission</text>

  <!-- fragments -->
  <ellipse cx="300" cy="85" rx="28" ry="20" fill="#ffedd5" stroke="#e3780c" stroke-width="2"/>
  <text x="300" y="90" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#9a3412">Ba</text>
  <ellipse cx="300" cy="155" rx="24" ry="18" fill="#ffedd5" stroke="#e3780c" stroke-width="2"/>
  <text x="300" y="160" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#9a3412">Kr</text>
  <text x="300" y="195" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">+ energy</text>

  <!-- neutrons out -->
  <circle cx="370" cy="70" r="9" fill="#2563eb"/>
  <circle cx="390" cy="120" r="9" fill="#2563eb"/>
  <circle cx="370" cy="170" r="9" fill="#2563eb"/>
  <text x="410" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#1e3a8a">≈2–3 n</text>

  <!-- chain panel -->
  <rect x="460" y="48" width="270" height="250" rx="12" fill="#eef3fe" stroke="#1865f2"/>
  <text x="595" y="78" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" fill="#0a2a66">Sustain a chain?</text>
  <text x="480" y="110" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#0a2a66">• Enough neutrons per fission</text>
  <text x="480" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#0a2a66">• Critical mass (enough fuel)</text>
  <text x="480" y="166" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#0a2a66">• Close packing (fewer escape)</text>
  <text x="480" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#186d32">Reactor: controlled (~3% U-235)</text>
  <text x="480" y="228" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#b91c1c">Weapon: uncontrolled (≫90%)</text>
  <text x="595" y="270" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#5b6170">HK: Daya Bay PWR</text>
</svg>
